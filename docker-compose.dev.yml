services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: music-tagger-worker:dev
    container_name: music-worker-dev
    environment:
      DATABASE_URL: file:/workspace/web/dev.db
      MUSIC_ROOT: /music
      CACHE_ROOT: /cache
      WORKER_ID: ${WORKER_ID:-worker-dev}
    volumes:
      - ./worker:/app/worker
      - ./web:/workspace/web
      - ${LOCAL_CACHE_DIR:-./.cache/transcode_cache}:/cache
      - ${LOCAL_MUSIC_DIR:?LOCAL_MUSIC_DIR is required}:/music
    restart: unless-stopped
