services:
  web:
    image: yourapp/web:latest
    container_name: music-web
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/app.db
      - MUSIC_ROOT=/music
      - TRANSCODE_CACHE=/cache
      - AUTH_SECRET=change-me
      # - BASE_URL=https://music.example.com
    volumes:
      - data:/data
      - transcode_cache:/cache
      # 宿主机先通过 NFS/SMB 挂载 NAS：例如 /mnt/nas/music
      - /mnt/nas/music:/music:rw
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    image: yourapp/worker:latest
    container_name: music-worker
    environment:
      - DATABASE_URL=file:/data/app.db
      - MUSIC_ROOT=/music
      - TRANSCODE_CACHE=/cache
      - WORKER_ID=worker-1
      - WORKER_CONCURRENCY=2
      # 可选：限制转码并发（由 worker 内部实现）
      - TRANSCODE_MAX_JOBS=1
    volumes:
      - data:/data
      - transcode_cache:/cache
      - /mnt/nas/music:/music:rw
    depends_on:
      - web
    restart: unless-stopped

volumes:
  data:
  transcode_cache:

